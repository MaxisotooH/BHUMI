# Pruebas automáticas en cada cambio a main y en cada pull request.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24'] # la mínima que exige BHUMI y la de la imagen Docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: API completa sobre el servidor HTTP
        run: npm test
      - name: La misma API atendida dentro del proceso (como en el navegador)
        run: npm run test:local
      - name: Con PDFKit, ExcelJS y EventEmitter de la versión de navegador
        run: npm run test:navegador
      - name: Con SQLite compilado a WebAssembly (sql.js)
        run: npm run test:wasm
      - name: Armar la versión de doble clic
        run: npm run construir

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Construir y probar la imagen
        run: |
          docker build -t bhumi:prueba .
          docker run -d --name bhumi -p 3000:3000 bhumi:prueba
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/salud && break; sleep 1; done
          curl -sf http://localhost:3000/api/salud | grep '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/settings)" = "401"
          docker stop bhumi
          test "$(docker inspect -f '{{.State.ExitCode}}' bhumi)" = "0"
