# Respaldo continuo de la base SQLite hacia un almacenamiento compatible con S3
# (AWS S3, Cloudflare R2, Backblaze B2, Google Cloud Storage en modo interoperable…).
# Las credenciales se leen de LITESTREAM_ACCESS_KEY_ID y LITESTREAM_SECRET_ACCESS_KEY.
dbs:
  - path: /datos/bhumi.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: bhumi
        endpoint: ${LITESTREAM_ENDPOINT}
        region: ${LITESTREAM_REGION}
        retention: 720h # 30 días de historial para recuperar a cualquier momento
        snapshot-interval: 24h
